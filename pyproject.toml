[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow"
version = "0.1.0"
description = "Local, evidence-first security analytics and detection engineering"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.7.0",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "SQLAlchemy==2.0.43",
  # Pin SQLAlchemy's platform-conditional dependency in macOS-generated deployment locks.
  "greenlet==3.5.6",
  "PyYAML==6.0.2",
  "regex==2025.7.34",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.3",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
  "mypy==1.17.1",
  "types-PyYAML==6.0.12.20250822",
  "types-regex==2025.7.34.20250809",
  "types-defusedxml==0.7.0.20260504",
  "pip-tools==7.6.1",
  "pip==26.2.1",
  "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/swagger/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
markers = [
  "parser: exact normalization contracts",
  "detection: positive detection scenarios",
  "negative: controlled benign scenarios",
  "replay: chronological replay contracts",
  "sigma: licensed Sigma compatibility",
  "security: untrusted input and access boundaries",
  "regression: behavioral regression contracts",
  "integration: API and persistence integration",
  "connectors: Microsoft and Windows telemetry adapters",
  "notifications: durable outbound notification delivery",
  "migration: additive schema upgrades and persistent state",
  "end_to_end: complete telemetry-to-notification workflows",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106"]
"scripts/**" = ["S603", "S607"]
"scripts/generate_test_data.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["backend/app"]
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["backend/app"]
branch = true
