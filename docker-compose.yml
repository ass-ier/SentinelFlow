services:
  sentinelflow:
    build: .
    ports:
      - "127.0.0.1:${SENTINEL_BACKEND_PORT:-8765}:8765"
    environment:
      SENTINEL_API_TOKEN: "${SENTINEL_API_TOKEN:?Set a local API token before running Docker}"
      SENTINEL_DATABASE_URL: sqlite:////srv/sentinelflow/data/sentinelflow-demo.sqlite3
    volumes:
      - sentinel-demo:/srv/sentinelflow/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /srv/sentinelflow/artifacts:rw,noexec,nosuid,uid=10001,gid=10001,size=32m
    pids_limit: 128
    mem_limit: 768m
    cpus: 2
    init: true

volumes:
  sentinel-demo:
